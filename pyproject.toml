[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mmdevc"
version = "0.1.0"
description = "AIAA3201 P3: Monocular Metric Depth Estimation and Video Consistency"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Qinchuan XIAO"}, {name = "Jun Yu Eugene YIP"}]
dependencies = []

[project.optional-dependencies]
data = ["numpy>=1.24", "Pillow>=10", "PyYAML>=6", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]
