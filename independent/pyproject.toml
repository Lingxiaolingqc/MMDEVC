[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aiaa3201-independent-depth"
version = "0.1.0"
description = "Independent depth estimation and flow-guided temporal fusion"
requires-python = ">=3.11"
dependencies = ["numpy>=2,<3", "opencv-python>=4.11", "scipy", "h5py", "matplotlib", "pillow", "tqdm"]

[project.optional-dependencies]
models = ["torch>=2.4", "torchvision>=0.19", "huggingface-hub", "safetensors", "einops", "timm", "easydict", "omegaconf", "imageio", "imageio-ffmpeg"]
dev = ["pytest>=8"]

[project.scripts]
depth-project = "depth_project.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
